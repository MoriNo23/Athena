<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" role="img" aria-label="ATENA">
  <style>
    .ink { stroke: #1d2330; }
    .brand { stroke: #3a72c4; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e9edf5; }
      .brand { stroke: #7fb2e8; }
    }
  </style>
  <!-- ATENA · wordmark monoline: la primera A en color de marca, el resto en tinta -->
  <g fill="none" stroke-width="10" stroke-linecap="butt">
    <g class="brand" stroke-linejoin="miter">
      <path d="M10 100 L33 20 L56 100" />
      <path d="M21 66 L45 66" />
    </g>
    <g class="ink" stroke-linejoin="miter">
      <path d="M78 20 L124 20 M101 20 L101 100" />
      <path d="M192 20 L146 20 L146 100 L192 100 M146 60 L184 60" />
      <path d="M282 100 L305 20 L328 100" />
      <path d="M293 66 L317 66" />
    </g>
    <!-- la N: sus uniones son agudas, el bisel corta la punta que deja el miter -->
    <path class="ink" stroke-linejoin="bevel" d="M214 100 L214 20 L260 100 L260 20" />
  </g>
</svg>
