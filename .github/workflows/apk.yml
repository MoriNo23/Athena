# Athena · APK release en la nube
#
# Compila el APK firmado SIN necesidad de Android Studio en tu máquina:
#   1. tests de la casa (incluye los del motor offline)
#   2. build web estática + sync de Capacitor
#   3. gradlew assembleRelease con el keystore de android/keystore/
# El APK sale como artifact «Athena-apk» en el resumen del run.
#
# Se dispara: manual (Actions → Athena APK → Run) o con cada push a main
# que toque código o la receta del APK.

name: Athena APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "public/**"
      - "android/**"
      - "scripts/**"
      - "index.html"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dependencias
        run: bun install

      - name: Tests (puerta de calidad)
        run: bun test

      - name: Build web estática + sync Capacitor
        run: bun run apk:sync

      - name: Compilar APK release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Athena-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Resumen
        run: |
          echo "## ✅ APK de Athena listo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUM
          echo "Descarga **Athena-apk** en la sección *Artifacts* de este run," >> $GITHUB_STEP_SUM
          echo "descomprime el zip y pasa el \`.apk\` a tu teléfono para instalarlo." >> $GITHUB_STEP_SUM
          echo "" >> $GITHUB_STEP_SUM
          echo "Teclas de acceso: menú «⋯» → **Teclas de acceso** (en el teléfono y en el escritorio)." >> $GITHUB_STEP_SUM
