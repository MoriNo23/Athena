# Athena · CI gate for pull requests and main
#
# Runs the three house checks (types, lint, tests) on every pull request and
# on every push to main that touches code or build config. A PR can only be
# merged with this workflow green. The release pipelines (Athena APK, Athena
# Linux) run `bun test` again as a second gate right before building.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "public/**"
      - "tests/**"
      - "scripts/**"
      - "index.html"
      - "login.html"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ci.yml"

jobs:
  check:
    # Versión FIJA, no `ubuntu-latest` a propósito: la etiqueta está migrando a
    # Ubuntu 26.04 (termina el 19-nov-2026), emitía un aviso en cada job del
    # resumen del run, y el día del cambio el pipeline se habría movido solo.
    # Subirlo a ubuntu-26.04 es una decisión aparte y probada. Lo mismo en los
    # otros workflows.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun test
