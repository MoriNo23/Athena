# Athena · CI gate for pull requests and main
#
# Runs the three house checks (types, lint, tests) on every pull request and
# on every push to main that touches code or build config. A PR can only be
# merged with this workflow green. The release pipelines (Athena APK, Athena
# Linux) run `bun test` again as a second gate right before building.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "tests/**"
      - "prisma/**"
      - "scripts/**"
      - "bin/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun test
