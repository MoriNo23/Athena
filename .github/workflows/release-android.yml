# Athena · APK de Android para el release
#
# Compila el APK firmado SIN necesidad de Android Studio en tu máquina:
#   1. tests de la casa (incluye los del motor offline)
#   2. build web estática + sync de Capacitor
#   3. comprueba que los SECRETOS de firma estén presentes (si falta uno, se
#      para: sin firma el build caería a la clave debug sin avisar) y
#   4. gradlew assembleRelease con ese keystore. El keystore ya no vive en el
#      repo: viaja en ANDROID_KEYSTORE_BASE64 + ANDROID_STORE_PASSWORD/
#      ANDROID_KEY_ALIAS/ANDROID_KEY_PASSWORD.
# El APK firmado queda como artifact «Athena-apk»; el release lo publica
# el workflow Athena Release (release.yml), que llama a este pipeline.
#
# Se dispara: a mano (Actions → Athena Android → Run workflow) o como
# reusable workflow desde Athena Release en cada push a main.

name: Athena Android

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dependencias
        run: bun install

      - name: Tests (puerta de calidad)
        run: bun test

      - name: Build web estática + sync Capacitor
        run: bun run apk:sync

      - name: Comprobar los secretos de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # El build.gradle cayó a firma debug si no hay firma; en CI eso NO es
          # aceptable (un APK firmado con la clave debug no puede actualizar lo
          # que ya está instalado). Si falta un secreto, se para aquí y en voz
          # alta en lugar de publicar un release roto.
          FALTAN=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "✗ Falta el secreto $v: el APK saldría firmado con debug." >&2
              FALTAN=1
            fi
          done
          if [ "$FALTAN" != "0" ]; then
            echo "→ Crea los cuatro secretos en Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          echo "✓ Los cuatro secretos de firma están presentes"

      - name: Compilar APK release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-release.log
          exit "${PIPESTATUS[0]}"

      - name: Diagnóstico del fallo (solo si falló)
        if: failure()
        run: |
          # Los logs crudos de Actions no se pueden bajar por API (redirigen a
          # un host aparte), pero las anotaciones «::error::» sí se leen. Este
          # paso existe para que un fallo de Gradle se entienda sin abrir la UI.
          LOG=android/gradle-release.log
          emitir() { local l="$1"; l="${l//%/%25}"; l="${l//$'\r'/%0D}"; echo "::error::$l"; }
          if [ ! -f "$LOG" ]; then
            emitir "No se generó $LOG: el fallo fue en la configuración de Gradle, antes de compilar."
            exit 0
          fi
          LINEAS=$(grep -A 10 "What went wrong" "$LOG" | grep -v '^--$' | tail -n 8)
          if [ -z "$LINEAS" ]; then
            LINEAS=$(grep -E "error:|Could not|Failed to|Invalid|Illegal|FAILURE" "$LOG" | tail -n 8)
          fi
          if [ -z "$LINEAS" ]; then
            LINEAS=$(tail -n 12 "$LOG" | grep -vE '^[[:space:]]*$')
          fi
          echo "$LINEAS" | while IFS= read -r l; do emitir "$l"; done

      - name: Renombrar APK con la versión
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          cp android/app/build/outputs/apk/release/app-release.apk "Athena-v${VERSION}.apk"
          echo "APK: Athena-v${VERSION}.apk"

      - name: Subir APK como artifact del run
        uses: actions/upload-artifact@v4
        with:
          name: Athena-apk
          path: Athena-v*.apk
          if-no-files-found: error
