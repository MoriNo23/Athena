# Athena · APK de Android para el release
#
# Compila el APK firmado SIN necesidad de Android Studio en tu máquina:
#   1. tests de la casa (incluye los del motor offline)
#   2. build web estática + sync de Capacitor
#   3. gradlew assembleRelease con el keystore de android/keystore/
# El APK firmado queda como artifact «Athena-apk»; el release lo publica
# el workflow Athena Release (release.yml), que llama a este pipeline.
#
# Se dispara: a mano (Actions → Athena Android → Run workflow) o como
# reusable workflow desde Athena Release en cada push a main.

name: Athena Android

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dependencias
        run: bun install

      - name: Tests (puerta de calidad)
        run: bun test

      - name: Build web estática + sync Capacitor
        run: bun run apk:sync

      - name: Compilar APK release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK con la versión
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          cp android/app/build/outputs/apk/release/app-release.apk "Athena-v${VERSION}.apk"
          echo "APK: Athena-v${VERSION}.apk"

      - name: Subir APK como artifact del run
        uses: actions/upload-artifact@v4
        with:
          name: Athena-apk
          path: Athena-v*.apk
          if-no-files-found: error
