# Athena · paquete Linux (Debian/Ubuntu y portable) para el release
#
# Construye la web de producción y la empaqueta en tres formatos, todos con
# el build ya hecho (server-dist/ + dist/):
#   - tarball:    descomprimir → ./scripts/athena start (nada que instalar)
#   - .deb:       sudo apt install ./athena_<versión>_amd64.deb → athena start
#   - .AppImage:  un solo fichero con Node dentro → doble clic y a leer
# Quedan empaquetados como artifact «Athena-linux»; el release lo publica
# el workflow Athena Release (release.yml), que llama a este pipeline.
#
# Se dispara: a mano (Actions → Athena Linux → Run) o como reusable
# workflow desde Athena Release en cada push a main.

name: Athena Linux

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node ≥ 23.4 para scripts y para el binario que viaja DENTRO del
      # AppImage (node:sqlite estable: la BD se crea sola, sin dependencias)
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Dependencias
        run: bun install

      - name: Tests (puerta de calidad)
        run: bun test

      - name: Build de producción
        run: bun run build

      - name: Empaquetar tarball Linux x64
        run: bash scripts/package-linux.sh

      - name: Empaquetar .deb (Debian/Ubuntu)
        run: bash scripts/package-deb.sh

      # appimagetool valida el metainfo al empaquetar y avisaba de que no lo
      # tenía; con appstreamcli instalado la validación es la oficial. Va como
      # paso propio para que un metainfo roto se vea como tal y no como
      # «falló el AppImage».
      - name: Validar metadatos AppStream
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq appstream
          appstreamcli validate --no-net packaging/linux/io.github.morino23.athena.appdata.xml

      # El smoke test arranca el AppImage DE VERDAD, pero con un AppRun de
      # prueba: `--appimage-extract-and-run` y un AppRun que solo imprime lo
      # que debe imprimir. Así se prueba el empaquetado —que la imagen se monte
      # y ejecute— sin mezclarlo con si el Node del runner funciona incrustado,
      # que es otra cosa. El AppRun real va en el paquete que se publica.
      - name: Preparar un AppRun de prueba
        run: |
          printf '#!/bin/sh\necho "AppRun de prueba: el AppImage se ha montado y ejecutado"\nexit 0\n' > /tmp/AppRun-prueba
          chmod +x /tmp/AppRun-prueba

      - name: Empaquetar .AppImage (portable, Node incluido)
        env:
          ATHENA_APPIMAGE_APPRUN: /tmp/AppRun-prueba
        run: bash scripts/package-appimage.sh

      - name: Prueba de humo del AppImage
        run: |
          APP=$(ls release/Athena-*-x86_64.AppImage)
          SALIDA=$("$APP" --appimage-extract-and-run 2>&1 || true)
          echo "$SALIDA" | head -5
          echo "$SALIDA" | grep -q "AppRun de prueba" \
            || { echo "::error::El AppImage no llega a ejecutar su AppRun"; exit 1; }

      # El .DirIcon y el metainfo no solo tienen que existir en el AppDir:
      # tienen que viajar dentro de la imagen que se publica.
      #
      # Se extrae con `--appimage-extract` (nativo del runtime, sin FUSE) y no
      # con `unsquashfs`: ese obligaba a instalar squashfs-tools en el runner, y
      # cuando el apt fallaba el paso moría sin decir por qué. Cada fallo de
      # aquí deja ahora su anotación, que es el único canal que me queda cuando
      # no puedo leer el log.
      - name: Comprobar lo que lleva dentro el AppImage
        run: |
          APP=$(ls release/Athena-*-x86_64.AppImage)
          ID=io.github.morino23.athena
          rm -rf /tmp/extraido && mkdir -p /tmp/extraido && cd /tmp/extraido
          "$APP" --appimage-extract > /tmp/extraccion.txt 2>&1 || {
            echo "::error::el AppImage no se puede extraer:"; tail -5 /tmp/extraccion.txt; exit 1; }
          falta=""
          for fichero in \
            .DirIcon \
            "$ID.png" \
            "$ID.desktop" \
            "usr/share/metainfo/$ID.appdata.xml" \
            "usr/share/applications/$ID.desktop"; do
            if [ -e "squashfs-root/$fichero" ]; then
              echo "OK  $fichero"
            else
              echo "::error::falta $fichero dentro del AppImage"
              falta=1
            fi
          done
          [ -z "$falta" ] || exit 1
          echo "::notice::El AppImage lleva icono, lanzador y metadatos AppStream"

      - name: Subir paquetes como artifact del run
        uses: actions/upload-artifact@v7
        with:
          name: Athena-linux
          path: |
            release/Athena-*-linux-x64.tar.gz
            release/athena_*_amd64.deb
            release/Athena-*-x86_64.AppImage
          if-no-files-found: error
