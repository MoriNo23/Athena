# Athena · paquete Linux (Debian/Ubuntu y portable) para el release
#
# Construye la web de producción y la empaqueta en tres formatos, todos con
# el build ya hecho (server-dist/ + dist/):
#   - tarball:    descomprimir → ./scripts/athena start (nada que instalar)
#   - .deb:       sudo apt install ./athena_<versión>_amd64.deb → athena start
#   - .AppImage:  un solo fichero con Node dentro → doble clic y a leer
# Quedan empaquetados como artifact «Athena-linux»; el release lo publica
# el workflow Athena Release (release.yml), que llama a este pipeline.
#
# Se dispara: a mano (Actions → Athena Linux → Run) o como reusable
# workflow desde Athena Release en cada push a main.

name: Athena Linux

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node ≥ 23.4 para scripts y para el binario que viaja DENTRO del
      # AppImage (node:sqlite estable: la BD se crea sola, sin dependencias)
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dependencias
        run: bun install

      - name: Tests (puerta de calidad)
        run: bun test

      - name: Build de producción
        run: bun run build

      - name: Empaquetar tarball Linux x64
        run: bash scripts/package-linux.sh

      - name: Empaquetar .deb (Debian/Ubuntu)
        run: bash scripts/package-deb.sh

      - name: Empaquetar .AppImage (portable, Node incluido)
        run: bash scripts/package-appimage.sh

      - name: Prueba de humo del AppImage (arranca y sirve)
        run: |
          APP=$(ls release/Athena-*-x86_64.AppImage)
          ATHENA_HOME="$RUNNER_TEMP/ai-home" PORT=3997 APPIMAGE_EXTRACT_AND_RUN=1 "$APP" &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3997/ >/dev/null; then echo "web OK tras ${i}s"; break; fi
            sleep 1
            if [ "$i" = 30 ]; then echo "el AppImage no llegó a servir"; kill $PID; exit 1; fi
          done
          kill $PID || true

      - name: Subir paquetes como artifact del run
        uses: actions/upload-artifact@v4
        with:
          name: Athena-linux
          path: |
            release/Athena-*-linux-x64.tar.gz
            release/athena_*_amd64.deb
            release/Athena-*-x86_64.AppImage
          if-no-files-found: error
