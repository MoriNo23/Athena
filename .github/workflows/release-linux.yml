# Athena · paquete Linux (Debian/Ubuntu) para el release
#
# Construye la web de producción y la empaqueta en dos formatos, ambos con
# el build ya hecho (server-dist/ + dist/):
#   - tarball:    descomprimir → ./scripts/athena start (nada que instalar)
#   - .deb:       sudo apt install ./athena_<versión>_amd64.deb → athena start
# Quedan adjuntos al release v<versión de package.json> como
# Athena-<versión>-linux-x64.tar.gz y athena_<versión>_amd64.deb.
#
# Se dispara: manual (Actions → Athena Linux → Run) o al pushear un tag v*.

name: Athena Linux

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Dependencias
        run: bun install

      - name: Tests (puerta de calidad)
        run: bun test

      - name: Build de producción
        run: bun run build

      - name: Empaquetar tarball Linux x64
        run: bash scripts/package-linux.sh

      - name: Empaquetar .deb (Debian/Ubuntu)
        run: bash scripts/package-deb.sh

      - name: Adjuntar al release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          TAG="v${VERSION}"
          TAR="release/Athena-${VERSION}-linux-x64.tar.gz"
          DEB="release/athena_${VERSION}_amd64.deb"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "Athena $TAG" --generate-notes
          gh release upload "$TAG" "$TAR" "$DEB" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Adjuntados $TAR y $DEB al release $TAG"
